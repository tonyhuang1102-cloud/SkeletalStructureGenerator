# Render reads this file when this repository is deployed as a Blueprint.
services:
  - type: web
    name: carbo-cat
    runtime: python
    plan: free
    buildCommand: >-
      python -m pip install -r requirements.txt
      && python -c "from app.chemistry import analyze_molecule; assert '<svg' in analyze_molecule('CCO')['svg']"
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
